<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>音乐播放</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#121019;padding:24px}
main{width:min(100%,520px);padding:28px 24px;border:1px solid #ffffff18;border-radius:22px;background:linear-gradient(135deg,#302037,#171422);box-shadow:0 18px 70px #0004}
audio{display:block;width:100%;accent-color:#e4a8ca}
p{color:#eccada;font:14px system-ui;text-align:center;margin:16px 0 0}
p[hidden]{display:none}
</style>
<main data-ui="minimal-player">
<audio id="music" controls loop preload="metadata" aria-label="音乐播放器" src="./assets/senren-op.mp3"></audio>
<p id="error" role="alert" hidden>音频加载失败，请刷新重试。</p>
</main>
<script>document.querySelector('#music').addEventListener('error',()=>{document.querySelector('#error').hidden=false});</script>
</html>
